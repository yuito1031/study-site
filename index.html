<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">学習管理</p>
            <h1>StudyFlow</h1>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active">ダッシュボード</button>
          <button class="nav-item">Todo</button>
          <button class="nav-item">レポート</button>
        </nav>

        <div class="mini-card">
          <p class="tiny-label">今日の状態</p>
          <h3 id="todayStatus">集中開始</h3>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">今日の学習</p>
            <h2 id="currentDate">2026年11月15日</h2>
          </div>
          <button class="ghost-btn">+ 学習を記録</button>
        </header>

        <section class="hero-grid">
          <div class="panel focus-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">集中タイマー</p>
                <h3>今日の学習時間</h3>
              </div>
              <span class="badge">25分</span>
            </div>

            <div class="timer-wrap">
              <div class="timer-ring">
                <div class="timer-value" id="timerDisplay">25:00</div>
              </div>
            </div>

            <div class="timer-actions">
              <button id="startBtn" class="primary-btn">開始</button>
              <button id="pauseBtn" class="secondary-btn">一時停止</button>
              <button id="resetBtn" class="ghost-btn">リセット</button>
            </div>
          </div>

          <div class="panel stats-panel">
            <div class="stat-block">
              <p class="tiny-label">総学習時間</p>
              <h3 id="totalStudyTime">120分</h3>
            </div>
            <div class="stat-block">
              <p class="tiny-label">完了ポモドーロ</p>
              <h3 id="pomodoroCount">4</h3>
            </div>
            <div class="stat-block">
              <p class="tiny-label">連続日数</p>
              <h3 id="streakCount">7日</h3>
            </div>
          </div>
        </section>

        <section class="content-grid">
          <div class="panel large-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">学習計画</p>
                <h3>今日のゴール</h3>
              </div>
            </div>

            <div id="planGrid" class="plan-grid"></div>
          </div>

          <div class="panel task-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">To-do</p>
                <h3>今日のタスク</h3>
              </div>
            </div>

            <form id="taskForm" class="task-form">
              <input id="taskInput" type="text" placeholder="例: 英単語20個を覚える" maxlength="60" />
              <select id="taskCategory">
                <option value="英語">英語</option>
                <option value="数学">数学</option>
                <option value="IT">IT</option>
                <option value="国語">国語</option>
              </select>
              <button type="submit" class="primary-btn">追加</button>
            </form>

            <ul id="taskList" class="task-list"></ul>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
