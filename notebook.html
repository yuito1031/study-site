<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111a2e" />
  <title>手書きノート — My Hub</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#20283d;background:#f6f7fb;--primary:#5865e8;--line:#e5e8f0;--muted:#7c8498}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#f6f7fb}button,input{font:inherit}button{cursor:pointer}.top{min-height:60px;padding:12px clamp(16px,4vw,36px);background:#111a2e;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:#fff;text-decoration:none;font-weight:700}.top small{color:#aab3c7}.wrap{max-width:1180px;margin:auto;padding:24px clamp(14px,3vw,30px) 50px}.intro h1{margin:0 0 6px;font-size:1.7rem}.intro p{margin:0;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:2;margin:20px 0 14px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 4px 16px #20283d0a}.toolbar button,.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;color:#30384d}.toolbar button.active{border-color:var(--primary);color:var(--primary);background:#f1f2ff}.toolbar button.save{border:0;background:var(--primary);color:white;font-weight:700}.toolbar input[type=color]{height:38px;width:44px;padding:3px}.toolbar input[type=range]{width:90px;padding:0}.toolbar .title{width:min(220px,48vw)}.toolbar select{max-width:150px}.status{min-height:1.5em;color:var(--muted);font-size:.86rem;margin:6px 2px}.status.error{color:#c34050}.canvas-wrap{max-width:850px;margin:0 auto;background:#dfe3ec;padding:12px;border-radius:14px}.sheet{display:block;width:100%;height:auto;aspect-ratio:3/4;background:white;touch-action:none;box-shadow:0 4px 16px #20283d1a;border-radius:3px;cursor:crosshair}.saved{margin-top:30px}.saved h2{font-size:1.1rem}.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.page{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;min-width:0}.page img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#f4f5f8;border-radius:7px;display:block}.page .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px}.page strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.86rem}.page button{border:1px solid var(--line);border-radius:7px;background:white;padding:5px 8px;color:#394258}.page button.delete{color:#b43d4d}.empty{color:var(--muted);font-size:.9rem}.hidden{display:none!important}.login-box{margin-top:20px;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:white}.login-box a{color:var(--primary);font-weight:700}@media(max-width:600px){.toolbar{gap:6px}.toolbar button,.toolbar select{padding:7px 9px;font-size:.88rem}.toolbar .title{order:10;width:100%}.canvas-wrap{padding:6px}}
  </style>
</head>
<body>
  <header class="top"><a href="./">← My Hub</a><small>手書きノート</small></header>
  <main class="wrap">
    <div class="intro"><h1>手書きノート</h1><p>ペンの種類を選んで書き込み、アカウントに保存できます。</p></div>
    <p id="status" class="status" role="status" aria-live="polite">接続しています…</p>
    <section id="editor" class="hidden" aria-label="手書きノート編集">
      <div class="toolbar">
        <label for="penType">ペンの種類</label>
        <select id="penType" aria-label="ペンの種類">
          <option value="ballpoint">ボールペン</option>
          <option value="pencil">鉛筆</option>
          <option value="marker">マーカー</option>
          <option value="highlighter">蛍光ペン</option>
        </select>
        <button id="penButton" class="active" type="button">✎ 書く</button>
        <button id="eraserButton" type="button">消しゴム</button>
        <label>色 <input id="color" type="color" value="#20283d" aria-label="ペンの色" /></label>
        <label>太さ <input id="size" type="range" min="2" max="28" value="5" aria-label="ペンの太さ" /></label>
        <button id="undo" type="button">↶ 戻す</button>
        <button id="clear" type="button">全消去</button>
        <input id="title" class="title" maxlength="80" placeholder="ノートのタイトル" aria-label="ノートのタイトル" />
        <button id="newPage" type="button">新しいページ</button>
        <button id="save" class="save" type="button">保存</button>
      </div>
      <div class="canvas-wrap"><canvas id="sheet" class="sheet" width="900" height="1200" aria-label="ここにペンで書けます"></canvas></div>
      <section class="saved"><h2>保存したノート</h2><div id="pages" class="pages"></div><p id="pagesEmpty" class="empty">保存したノートはありません。</p></section>
    </section>
    <section id="loginPrompt" class="login-box hidden"><strong>ログインが必要です</strong><p>手書きノートを使うには、My Hubにログインしてください。</p><a href="./">My Hubへ戻る</a></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20261115-notebook"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const canvas = $('sheet');
      const ctx = canvas.getContext('2d');
      const state = { client:null, user:null, notebooks:[], strokes:[], activeStroke:null, baseImage:null, mode:'draw', currentId:null, saving:false };
      function status(text, error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
      function point(event){const rect=canvas.getBoundingClientRect();return{x:(event.clientX-rect.left)*canvas.width/rect.width,y:(event.clientY-rect.top)*canvas.height/rect.height}}
      function strokeStyle(stroke){
        const type=stroke.type;
        let width=stroke.width,alpha=1,composite='source-over';
        if(type==='pencil'){width*=0.72;alpha=0.58}
        if(type==='marker'){width*=2.6;alpha=0.62}
        if(type==='highlighter'){width*=4;alpha=0.28}
        if(stroke.erase){width*=3;alpha=1;composite='destination-out'}
        return{width,alpha,composite};
      }
      function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        if(state.baseImage)ctx.drawImage(state.baseImage,0,0,canvas.width,canvas.height);
        for(const stroke of state.strokes){if(!stroke.points.length)continue;const style=strokeStyle(stroke);ctx.save();ctx.globalAlpha=style.alpha;ctx.globalCompositeOperation=style.composite;ctx.strokeStyle=stroke.color;ctx.fillStyle=stroke.color;ctx.lineWidth=style.width;ctx.lineCap='round';ctx.lineJoin='round';
          if(stroke.points.length===1){const p=stroke.points[0];ctx.beginPath();ctx.arc(p.x,p.y,style.width/2,0,Math.PI*2);ctx.fill()}
          else{ctx.beginPath();ctx.moveTo(stroke.points[0].x,stroke.points[0].y);for(let i=1;i<stroke.points.length;i++)ctx.lineTo(stroke.points[i].x,stroke.points[i].y);ctx.stroke()}
          // Slightly textured double pass gives the pencil tool a softer graphite look.
          if(stroke.type==='pencil'&&!stroke.erase&&stroke.points.length>1){ctx.globalAlpha=.16;ctx.lineWidth=Math.max(1,style.width*.35);ctx.beginPath();ctx.moveTo(stroke.points[0].x+.7,stroke.points[0].y+.5);for(let i=1;i<stroke.points.length;i++)ctx.lineTo(stroke.points[i].x+.7,stroke.points[i].y+.5);ctx.stroke()}
          ctx.restore();
        }
      }
      function blank(){state.currentId=null;state.strokes=[];state.baseImage=null;$('title').value='';draw();status('新しいページです。ペンの種類を選んで書き、保存してください。')}
      function setMode(mode){state.mode=mode;$('penButton').classList.toggle('active',mode==='draw');$('eraserButton').classList.toggle('active',mode==='erase')}
      canvas.addEventListener('pointerdown',event=>{if(!state.user)return;event.preventDefault();canvas.setPointerCapture(event.pointerId);state.activeStroke={type:state.mode==='erase'?'eraser':$('penType').value,erase:state.mode==='erase',color:$('color').value,width:Number($('size').value),points:[point(event)]};state.strokes.push(state.activeStroke);draw()});
      canvas.addEventListener('pointermove',event=>{if(!state.activeStroke)return;event.preventDefault();state.activeStroke.points.push(point(event));draw()});
      function endStroke(){state.activeStroke=null}canvas.addEventListener('pointerup',endStroke);canvas.addEventListener('pointercancel',endStroke);canvas.addEventListener('lostpointercapture',endStroke);
      $('penButton').addEventListener('click',()=>setMode('draw'));$('eraserButton').addEventListener('click',()=>setMode('erase'));
      $('undo').addEventListener('click',()=>{state.strokes.pop();draw()});
      $('clear').addEventListener('click',()=>{if(confirm('このページの書き込みをすべて消しますか？')){state.strokes=[];state.baseImage=null;draw()}});
      $('newPage').addEventListener('click',()=>{if((state.strokes.length||state.baseImage)&&!confirm('未保存の内容を閉じて新しいページを作りますか？'))return;blank()});
      function imageOf(note){return note?.imageDataUrl||note?.drawing||''}
      function openNotebook(note){state.currentId=note.id;state.strokes=[];$('title').value=note.title||'';const image=new Image();image.onload=()=>{state.baseImage=image;draw();status(`「${note.title||'無題'}」を開きました。変更したら保存してください。`)};image.onerror=()=>status('ノート画像を読み込めませんでした。',true);image.src=imageOf(note)}
      function renderList(){const holder=$('pages');holder.replaceChildren();const notes=state.notebooks.filter(n=>imageOf(n));$('pagesEmpty').classList.toggle('hidden',notes.length>0);for(const note of [...notes].reverse()){const card=document.createElement('article');card.className='page';const image=document.createElement('img');image.src=imageOf(note);image.alt=`${note.title||'無題'}のプレビュー`;const row=document.createElement('div');row.className='row';const title=document.createElement('strong');title.textContent=note.title||'無題';const open=document.createElement('button');open.type='button';open.textContent='開く';open.addEventListener('click',()=>openNotebook(note));const del=document.createElement('button');del.type='button';del.textContent='削除';del.className='delete';del.addEventListener('click',()=>deleteNotebook(note));row.append(title,open,del);card.append(image,row);holder.append(card)}}
      async function loadNotebooks(){const{data,error}=await state.client.from('study_profiles').select('workspace').eq('user_id',state.user.id).maybeSingle();if(error)throw error;if(!data)throw new Error('プロフィールが見つかりません。My Hubへログインし直してください。');const workspace=data.workspace&&typeof data.workspace==='object'?data.workspace:{};state.notebooks=Array.isArray(workspace.notebooks)?workspace.notebooks:[];renderList()}
      async function saveNotebook(){if(state.saving)return;state.saving=true;$('save').disabled=true;status('保存しています…');try{const imageDataUrl=canvas.toDataURL('image/jpeg',.68);const now=new Date().toISOString();const note={id:state.currentId||globalThis.crypto.randomUUID(),title:$('title').value.trim()||'無題',createdAt:state.notebooks.find(n=>n.id===state.currentId)?.createdAt||now,updatedAt:now,imageDataUrl};const{data,error}=await state.client.from('study_profiles').select('workspace').eq('user_id',state.user.id).maybeSingle();if(error)throw error;if(!data)throw new Error('保存先プロフィールが見つかりません。');const workspace=data.workspace&&typeof data.workspace==='object'?data.workspace:{};const notebooks=Array.isArray(workspace.notebooks)?[...workspace.notebooks]:[];const index=notebooks.findIndex(n=>n.id===note.id);if(index>=0)notebooks[index]=note;else notebooks.push(note);const{error:updateError}=await state.client.from('study_profiles').update({workspace:{...workspace,notebooks},updated_at:now}).eq('user_id',state.user.id);if(updateError)throw updateError;state.notebooks=notebooks;state.currentId=note.id;renderList();status('ノートを保存しました。')}catch(error){console.error(error);status(`保存できませんでした: ${error.message||'接続を確認してください。'}`,true)}finally{state.saving=false;$('save').disabled=false}}
      async function deleteNotebook(note){if(!confirm(`「${note.title||'無題'}」を削除しますか？`))return;try{const{data,error}=await state.client.from('study_profiles').select('workspace').eq('user_id',state.user.id).maybeSingle();if(error)throw error;const workspace=data?.workspace&&typeof data.workspace==='object'?data.workspace:{};const notebooks=(Array.isArray(workspace.notebooks)?workspace.notebooks:[]).filter(n=>n.id!==note.id);const{error:updateError}=await state.client.from('study_profiles').update({workspace:{...workspace,notebooks},updated_at:new Date().toISOString()}).eq('user_id',state.user.id);if(updateError)throw updateError;state.notebooks=notebooks;if(state.currentId===note.id)blank();renderList();status('ノートを削除しました。')}catch(error){console.error(error);status(`削除できませんでした: ${error.message||'接続を確認してください。'}`,true)}}
      $('save').addEventListener('click',saveNotebook);
      async function init(){try{if(!window.supabase||!window.STUDYFLOW_SUPABASE_URL||!window.STUDYFLOW_SUPABASE_ANON_KEY)throw new Error('Supabaseの設定を確認してください。');state.client=window.supabase.createClient(window.STUDYFLOW_SUPABASE_URL,window.STUDYFLOW_SUPABASE_ANON_KEY);const{data,error}=await state.client.auth.getSession();if(error)throw error;if(!data.session?.user){$('loginPrompt').classList.remove('hidden');status('ログインが必要です。');return}state.user=data.session.user;$('editor').classList.remove('hidden');await loadNotebooks();blank()}catch(error){console.error(error);status(error.message||'ノートを開けませんでした。',true)}}
      init();
    })();
  </script>
</body>
</html>
