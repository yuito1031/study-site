<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111a2e" />
  <title>手書きノート — My Hub</title>
  <style>
    :root {
      --sky: #1e9dee;
      --sky-dark: #0a87d4;
      --navy: #0c3b6d;
      --panel: rgba(255,255,255,.12);
      --panel-strong: rgba(255,255,255,.18);
      --line: rgba(255,255,255,.24);
      --text: #edf6ff;
      --muted: rgba(237,246,255,.78);
      --card-shadow: rgba(9,53,96,.22);
      --page-bg: #f8f9fb;
      --ink: #1d2333;
      --soft: #dfe7f4;
      --tint-blue: #eaf5ff;
      --tint-purple: #ece7ff;
      --tint-yellow: #fff3df;
      --tint-green: #e8fff7;
      --primary: #2d7ff9;
      --danger: #d94d5d;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #1ca0e2 0%, #1d9ae7 16%, #1591d9 100%);
      color: var(--text);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    .notebook-app {
      min-height: 100vh;
      padding: 18px 18px 26px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 84px;
      padding: 0 14px 0 6px;
    }

    .brand-box h1 {
      margin: 0;
      font-size: clamp(1.8rem, 1.4vw + 1.3rem, 2.6rem);
      line-height: 1.2;
      letter-spacing: 0.02em;
      font-weight: 800;
    }
    .brand-box small {
      display: inline-block;
      margin-top: 6px;
      font-size: .92rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.08);
      color: var(--text);
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }
    .header-btn.primary {
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.32);
    }

    .tabbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 8px 0 20px;
      padding-left: 4px;
    }

    .tab {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.82);
      border-radius: 999px;
      min-height: 38px;
      padding: 0 18px;
      font-weight: 700;
    }
    .tab.active {
      background: rgba(255,255,255,.18);
      color: white;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }

    .cover-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(190px, 1fr));
      gap: 22px;
      align-items: end;
      min-height: 260px;
      margin: 10px 0 28px;
      padding: 10px 8px 0;
    }

    .cover-item {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 200px;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease;
    }
    .cover-item:hover { transform: translateY(-2px); }

    .notebook-cover {
      position: relative;
      width: min(76%, 210px);
      height: 160px;
      border-radius: 9px 9px 6px 6px;
      border: 1px solid rgba(0,0,0,.14);
      box-shadow: 0 14px 28px rgba(5, 26, 48, .16);
      overflow: hidden;
      background: #fff;
      color: #1f2637;
    }
    .notebook-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(14,22,40,.09),
        rgba(14,22,40,.09) 1px,
        transparent 1px,
        transparent 5px
      );
      opacity: .75;
      pointer-events: none;
    }
    .notebook-cover .header-band {
      position: absolute;
      inset: 0 0 auto 0;
      height: 26px;
      background: linear-gradient(180deg, rgba(21,24,36,.90), rgba(29,38,57,.78));
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .notebook-cover .brand-text {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: .62rem;
      letter-spacing: .12em;
      color: rgba(255,255,255,.8);
      font-weight: 700;
      text-transform: uppercase;
    }
    .notebook-cover .label {
      position: absolute;
      inset: 36px 16px auto 16px;
      font-size: 1.85rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notebook-cover.yellow { background: linear-gradient(180deg, #f7d531, #e8c52c); }
    .notebook-cover.blue { background: linear-gradient(180deg, #1d3d7a, #152d56); }
    .notebook-cover.blue .label { color: #f3f9ff; }
    .notebook-cover.purple { background: linear-gradient(180deg, #d6d9fb, #c8cce9); }
    .notebook-cover.white { background: linear-gradient(180deg, #f2f5f9, #ebeff4); }
    .notebook-cover.dark {
      background: linear-gradient(180deg, #101c2a, #0b1320);
      color: #fff;
    }
    .notebook-cover.dark .label { color: #f5f9ff; }

    .cover-meta {
      margin-top: 14px;
      text-align: center;
      width: 100%;
    }
    .cover-meta .title {
      display: block;
      font-size: 1.02rem;
      font-weight: 700;
      color: white;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cover-meta .subtitle {
      display: block;
      margin-top: 2px;
      color: rgba(255,255,255,.8);
      font-size: .82rem;
    }

    .notice-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 64px;
      margin: 22px 8px 20px;
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,.1);
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }
    .notice-box .notice-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
    }
    .notice-box .notice-title .icon {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
    }
    .notice-box .notice-hint {
      color: rgba(255,255,255,.76);
      font-size: .95rem;
    }

    .recent-panel {
      margin: 0 8px;
      padding-bottom: 6px;
    }
    .recent-panel .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 2px 18px;
      font-size: clamp(1.2rem, 1vw + 1rem, 1.7rem);
      font-weight: 800;
    }
    .recent-panel .heading .link {
      color: rgba(255,255,255,.8);
      font-size: .82rem;
      font-weight: 700;
    }

    .recent-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(170px, 1fr));
      gap: 18px;
      overflow: hidden;
      align-items: stretch;
    }

    .recent-card {
      position: relative;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      overflow: hidden;
      min-height: 225px;
      box-shadow: 0 12px 28px rgba(7,38,72,.12);
      transition: transform .2s ease, box-shadow .2s ease;
      cursor: pointer;
    }
    .recent-card:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(7,38,72,.18); }

    .recent-card .thumb {
      position: relative;
      height: 150px;
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid rgba(11,20,35,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(244,247,250,.95));
      overflow: hidden;
    }
    .recent-card .thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(13,18,31,.07),
        rgba(13,18,31,.07) 1px,
        transparent 1px,
        transparent 6px
      );
      opacity: .8;
      pointer-events: none;
    }
    .recent-card .thumb .mini-lines {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(97,106,142,.05) 100%);
    }
    .recent-card .thumb .mini-title {
      position: absolute;
      left: 12px;
      top: 18px;
      font-size: .88rem;
      color: rgba(18,24,36,.72);
      font-weight: 700;
    }
    .recent-card .thumb .mini-mark {
      position: absolute;
      right: 12px;
      top: 18px;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(19,84,175,.1);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #143d7a;
    }
    .recent-card .body {
      padding: 12px 12px 10px;
    }
    .recent-card .meta {
      color: rgba(255,255,255,.76);
      font-size: .74rem;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .recent-card .title {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.45;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-card .sub {
      display: block;
      margin-top: 6px;
      color: rgba(255,255,255,.76);
      font-size: .8rem;
    }

    .editor-panel {
      margin-top: 26px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      padding: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .toolbar label, .toolbar span { color: rgba(255,255,255,.84); font-weight: 700; }
    .toolbar select, .toolbar input[type="text"], .toolbar input[type="color"], .toolbar input[type="range"], .toolbar button {
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      color: white;
      min-height: 36px;
      padding: 0 10px;
    }
    .toolbar input[type="color"] { min-width: 50px; padding: 4px; }
    .toolbar input[type="range"] { width: 110px; }
    .toolbar button {
      padding: 0 14px;
      font-weight: 700;
    }
    .toolbar button.active {
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.24);
    }
    .toolbar .save-btn {
      margin-left: auto;
      background: linear-gradient(180deg, #2e7dfb, #1f67d9);
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(28,112,220,.28);
    }

    .canvas-wrap {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
    }
    .sheet { display: block; width: min(100%, 900px); margin: 0 auto; border-radius: 4px; background: white; box-shadow: 0 16px 30px rgba(8,24,44,.18); }

    .status {
      min-height: 1.4em;
      color: rgba(255,255,255,.82);
      margin: 8px 0 0;
      font-size: .9rem;
    }
    .status.error { color: #ffd2d9; }

    .login-box {
      margin: 34px auto 0;
      width: min(100%, 540px);
      padding: 26px 22px;
      border-radius: 18px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      text-align: center;
    }
    .login-box strong { display: block; font-size: 1.4rem; margin-bottom: 8px; }
    .login-box a {
      display: inline-block;
      margin-top: 10px;
      font-weight: 700;
      color: white;
      text-decoration: underline;
    }

    @media (max-width: 980px) {
      .cover-row { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
      .recent-grid { grid-template-columns: repeat(2, minmax(170px, 1fr)); }
      .topbar { flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 560px) {
      .notebook-app { padding: 14px 12px 20px; }
      .cover-row, .recent-grid { grid-template-columns: 1fr; }
      .toolbar { justify-content: center; }
      .toolbar .save-btn { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="notebook-app">
    <header class="topbar">
      <div class="brand-box">
        <h1>ようこそ、小川結土さん！</h1>
        <small>今日は 11月15日（土）です</small>
      </div>
      <div class="header-actions">
        <button class="header-btn" type="button">⏰ 時間割</button>
        <button class="header-btn primary" type="button">＋ ジュノートを作る</button>
      </div>
    </header>

    <nav class="tabbar" aria-label="ノート種別">
      <button class="tab active" type="button">授業ノート</button>
      <button class="tab" type="button">ジュノート</button>
    </nav>

    <section id="coverRow" class="cover-row" aria-label="おすすめノート"></section>

    <div class="notice-box">
      <div class="notice-title"><span class="icon">◌</span> 通知</div>
      <div class="notice-hint">通知はまだありません</div>
    </div>

    <section class="recent-panel" aria-label="最近開いたノート">
      <div class="heading">
        <span>最近使ったページ</span>
        <a href="#" class="link">すべて見る</a>
      </div>
      <div id="recentGrid" class="recent-grid"></div>
    </section>

    <section id="editorPanel" class="editor-panel hidden" aria-label="手書きノート編集">
      <div class="toolbar">
        <label for="penType">ペン</label>
        <select id="penType" aria-label="ペンの種類">
          <option value="ballpoint">ボールペン</option>
          <option value="pencil">鉛筆</option>
          <option value="marker">マーカー</option>
          <option value="highlighter">蛍光ペン</option>
        </select>
        <button id="penButton" class="active" type="button">✎ 書く</button>
        <button id="eraserButton" type="button">消しゴム</button>
        <label>色</label>
        <input id="color" type="color" value="#20283d" aria-label="ペンの色" />
        <label>太さ</label>
        <input id="size" type="range" min="2" max="28" value="5" aria-label="ペンの太さ" />
        <button id="undo" type="button">↶ 戻す</button>
        <button id="clear" type="button">全消去</button>
        <input id="title" type="text" maxlength="80" placeholder="ノートのタイトル" aria-label="ノートのタイトル" style="width: min(220px, 36vw);" />
        <button id="newPage" type="button">新しいページ</button>
        <button id="save" class="save-btn" type="button">保存</button>
      </div>
      <div class="canvas-wrap">
        <canvas id="sheet" class="sheet" width="900" height="1200" aria-label="ここにペンで書けます"></canvas>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">接続しています…</p>

    <section id="loginPrompt" class="login-box hidden">
      <strong>ログインが必要です</strong>
      <p>手書きノートを使うには、My Hubにログインしてください。</p>
      <a href="./">My Hubへ戻る</a>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20261115-notebook"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const canvas = $('sheet');
      const ctx = canvas.getContext('2d');
      const state = { client:null, user:null, notebooks:[], strokes:[], activeStroke:null, baseImage:null, mode:'draw', currentId:null, saving:false };

      const demoCovers = [
        { title: '漢字専用アルファ', note: '授業ノート', color: 'white' },
        { title: '英単語', note: '英語', color: 'yellow' },
        { title: '数学', note: '授業ノート', color: 'blue' },
        { title: '歴史', note: '定期テスト', color: 'purple' },
      ];

      function status(text, error=false){
        const el = $('status');
        el.textContent = text;
        el.classList.toggle('error', error);
      }

      function point(event){
        const rect = canvas.getBoundingClientRect();
        return { x:(event.clientX - rect.left) * canvas.width / rect.width, y:(event.clientY - rect.top) * canvas.height / rect.height };
      }

      function strokeStyle(stroke){
        const type = stroke.type;
        let width = stroke.width;
        let alpha = 1;
        let composite = 'source-over';
        if (type === 'pencil') { width *= 0.72; alpha = 0.58; }
        if (type === 'marker') { width *= 2.6; alpha = 0.62; }
        if (type === 'highlighter') { width *= 4; alpha = 0.28; }
        if (stroke.erase) { width *= 3; alpha = 1; composite = 'destination-out'; }
        return { width, alpha, composite };
      }

      function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        if (state.baseImage) ctx.drawImage(state.baseImage, 0, 0, canvas.width, canvas.height);
        for (const stroke of state.strokes) {
          if (!stroke.points.length) continue;
          const style = strokeStyle(stroke);
          ctx.save();
          ctx.globalAlpha = style.alpha;
          ctx.globalCompositeOperation = style.composite;
          ctx.strokeStyle = stroke.color;
          ctx.fillStyle = stroke.color;
          ctx.lineWidth = style.width;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (stroke.points.length === 1) {
            const p = stroke.points[0];
            ctx.beginPath();
            ctx.arc(p.x, p.y, style.width / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
            for (let i = 1; i < stroke.points.length; i++) {
              ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
            }
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function blank(){
        state.currentId = null;
        state.strokes = [];
        state.baseImage = null;
        $('title').value = '';
        draw();
        status('新しいページです。ペンの種��を選んで書き、保存してください。');
      }

      function setMode(mode){
        state.mode = mode;
        $('penButton').classList.toggle('active', mode === 'draw');
        $('eraserButton').classList.toggle('active', mode === 'erase');
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (!state.user) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        state.activeStroke = {
          type: state.mode === 'erase' ? 'eraser' : $('penType').value,
          erase: state.mode === 'erase',
          color: $('color').value,
          width: Number($('size').value),
          points: [point(event)]
        };
        state.strokes.push(state.activeStroke);
        draw();
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!state.activeStroke) return;
        event.preventDefault();
        state.activeStroke.points.push(point(event));
        draw();
      });

      function endStroke(){ state.activeStroke = null; }
      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);
      canvas.addEventListener('lostpointercapture', endStroke);

      $('penButton').addEventListener('click', () => setMode('draw'));
      $('eraserButton').addEventListener('click', () => setMode('erase'));
      $('undo').addEventListener('click', () => { state.strokes.pop(); draw(); });
      $('clear').addEventListener('click', () => {
        if (confirm('このページの書き込みをすべて消しますか？')) {
          state.strokes = [];
          state.baseImage = null;
          draw();
        }
      });
      $('newPage').addEventListener('click', () => {
        if ((state.strokes.length || state.baseImage) && !confirm('未保存の内容を閉じて新しいページを作りますか？')) return;
        blank();
      });

      function imageOf(note){ return note?.imageDataUrl || note?.drawing || ''; }

      function openNotebook(note){
        $('editorPanel').classList.remove('hidden');
        state.currentId = note.id;
        state.strokes = [];
        $('title').value = note.title || '';
        const image = new Image();
        image.onload = () => { state.baseImage = image; draw(); status(`「${note.title || '無題'}」を開きました。変更したら保存してください。`); };
        image.onerror = () => status('ノート画像を読み込めませんでした。', true);
        image.src = imageOf(note);
      }

      function renderCoverRow(){
        const row = $('coverRow');
        row.replaceChildren();
        const list = state.notebooks.length ? state.notebooks.slice(0, 4) : demoCovers;
        for (const item of list) {
          const card = document.createElement('div');
          card.className = 'cover-item';
          if (item && item.id) card.addEventListener('click', () => openNotebook(item));
          const cover = document.createElement('div');
          const palette = item.color || item.palette || 'white';
          cover.className = `notebook-cover ${palette}`;
          const band = document.createElement('div');
          band.className = 'header-band';
          const brand = document.createElement('div');
          brand.className = 'brand-text';
          brand.textContent = 'Campus';
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = item.title || 'ノート';
          cover.append(band, brand, label);
          const meta = document.createElement('div');
          meta.className = 'cover-meta';
          const title = document.createElement('span');
          title.className = 'title';
          title.textContent = item.title || '授業ノート';
          const sub = document.createElement('span');
          sub.className = 'subtitle';
          sub.textContent = item.note || '授業ノート';
          meta.append(title, sub);
          card.append(cover, meta);
          row.append(card);
        }
      }

      function renderRecentGrid(){
        const grid = $('recentGrid');
        grid.replaceChildren();
        const list = state.notebooks.length ? state.notebooks.slice(0, 6) : demoCovers;
        for (const item of list) {
          const card = document.createElement('article');
          card.className = 'recent-card';
          if (item && item.id) card.addEventListener('click', () => openNotebook(item));
          const thumb = document.createElement('div');
          thumb.className = 'thumb';
          const miniLines = document.createElement('div');
          miniLines.className = 'mini-lines';
          const miniTitle = document.createElement('div');
          miniTitle.className = 'mini-title';
          miniTitle.textContent = item.title || '授業ノート';
          const miniMark = document.createElement('div');
          miniMark.className = 'mini-mark';
          miniMark.textContent = 'ノ';
          thumb.append(miniLines, miniTitle, miniMark);
          const body = document.createElement('div');
          body.className = 'body';
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = '最終更新 ' + (item.updatedAt ? new Date(item.updatedAt).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }) : '2026/11/15');
          const title = document.createElement('span');
          title.className = 'title';
          title.textContent = item.title || '授業ノート';
          const sub = document.createElement('span');
          sub.className = 'sub';
          sub.textContent = item.note || '授業ノート';
          body.append(meta, title, sub);
          card.append(thumb, body);
          grid.append(card);
        }
      }

      async function loadNotebooks(){
        const { data, error } = await state.client.from('study_profiles').select('workspace').eq('user_id', state.user.id).maybeSingle();
        if (error) throw error;
        const workspace = data && typeof data.workspace === 'object' ? data.workspace : {};
        state.notebooks = Array.isArray(workspace.notebooks) ? workspace.notebooks : [];
        renderCoverRow();
        renderRecentGrid();
      }

      async function saveNotebook(){
        if (state.saving) return;
        state.saving = true;
        try {
          const imageDataUrl = canvas.toDataURL('image/jpeg', .68);
          const now = new Date().toISOString();
          const note = {
            id: state.currentId || globalThis.crypto?.randomUUID?.() || String(Date.now()),
            title: $('title').value.trim() || '無題',
            createdAt: state.notebooks.find(n => n.id === state.currentId)?.createdAt || now,
            updatedAt: now,
            imageDataUrl,
            note: '授業ノート'
          };

          const { data, error } = await state.client.from('study_profiles').select('workspace').eq('user_id', state.user.id).maybeSingle();
          if (error) throw error;
          const workspace = data && typeof data.workspace === 'object' ? data.workspace : {};
          const notebooks = Array.isArray(workspace.notebooks) ? [...workspace.notebooks] : [];
          const index = notebooks.findIndex(n => n.id === note.id);
          if (index >= 0) notebooks[index] = note; else notebooks.push(note);

          const { error: updateError } = await state.client.from('study_profiles').update({
            workspace: { ...workspace, notebooks },
            updated_at: now
          }).eq('user_id', state.user.id);
          if (updateError) throw updateError;

          state.notebooks = notebooks;
          state.currentId = note.id;
          renderCoverRow();
          renderRecentGrid();
          status('ノートを保存しました。');
        } catch (error) {
          console.error(error);
          status(`保存できませんでした: ${error.message || '接続を確認してください。'}`, true);
        } finally {
          state.saving = false;
        }
      }

      async function deleteNotebook(note){
        if (!confirm(`「${note.title || '無題'}」を削除しますか？`)) return;
        try {
          const { data, error } = await state.client.from('study_profiles').select('workspace').eq('user_id', state.user.id).maybeSingle();
          if (error) throw error;
          const workspace = data && typeof data.workspace === 'object' ? data.workspace : {};
          const notebooks = (Array.isArray(workspace.notebooks) ? workspace.notebooks : []).filter(n => n.id !== note.id);
          const { error: updateError } = await state.client.from('study_profiles').update({
            workspace: { ...workspace, notebooks },
            updated_at: new Date().toISOString()
          }).eq('user_id', state.user.id);
          if (updateError) throw updateError;
          state.notebooks = notebooks;
          renderCoverRow();
          renderRecentGrid();
          if (state.currentId === note.id) blank();
          status('ノートを削除しました。');
        } catch (error) {
          console.error(error);
          status(`削除できませんでした: ${error.message || '接続を確認してください。'}`, true);
        }
      }

      $('save').addEventListener('click', saveNotebook);

      async function init(){
        try {
          if (!window.supabase || !window.STUDYFLOW_SUPABASE_URL || !window.STUDYFLOW_SUPABASE_ANON_KEY) {
            throw new Error('Supabaseの設定を確認してください。');
          }
          state.client = window.supabase.createClient(window.STUDYFLOW_SUPABASE_URL, window.STUDYFLOW_SUPABASE_ANON_KEY);
          const { data, error } = await state.client.auth.getSession();
          if (error) throw error;
          if (!data.session?.user) {
            $('loginPrompt').classList.remove('hidden');
            status('ログインが必要です。');
            return;
          }
          state.user = data.session.user;
          await loadNotebooks();
          $('editorPanel').classList.remove('hidden');
          blank();
        } catch (error) {
          console.error(error);
          status(error.message || 'ノートを開けませんでした。', true);
        }
      }

      init();
    })();
  </script>
</body>
</html>
