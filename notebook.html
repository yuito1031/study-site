<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111a2e" />
  <title>手書きノート — My Hub</title>
  <style>
    :root {
      --bg: #dfe4eb;
      --sidebar-bg: #f2f3f7;
      --paper: #ffffff;
      --line: rgba(20, 31, 43, 0.09);
      --ink: #20283d;
      --ink-soft: rgba(32, 40, 61, 0.7);
      --toolbar-bg: #eceef4;
      --toolbar-border: #d5dbe5;
      --tool-btn: #f9fafc;
      --tool-btn-active: #dfeaf9;
      --blue: #2c7ef5;
      --shadow: rgba(22, 45, 75, 0.12);
      --danger: #d1484d;
      --muted: #6f7b8e;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; background: var(--bg);
      font-family: "Noto Sans JP", "Segoe UI", sans-serif; color: var(--ink);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    .workspace {
      display: flex;
      min-height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      width: 240px;
      background: #f7f7fb;
      border-right: 1px solid #dfe3ed;
      display: flex;
      flex-direction: column;
      padding: 14px 12px 18px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 14px;
      border-bottom: 1px solid rgba(17, 24, 39, 0.06);
      margin-bottom: 12px;
    }
    .book-name {
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .book-count {
      color: var(--muted);
      font-size: 0.72rem;
      background: rgba(32,40,61,.06);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .page-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
      padding: 8px 4px 8px 0;
    }

    .page-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(17,24,39,0.08);
      border-radius: 10px;
      padding: 8px 8px;
      min-height: 76px;
      transition: background .2s ease;
    }
    .page-item.active {
      background: #eaf1ff;
      border-color: rgba(40, 106, 222, 0.2);
    }
    .page-thumb {
      width: 54px;
      height: 70px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #fff, #edf1f8);
      border: 1px solid rgba(17,24,39,0.08);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }
    .page-thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(17, 24, 39, 0.08),
        rgba(17, 24, 39, 0.08) 1px,
        transparent 1px,
        transparent 5px
      );
      opacity: 0.7;
    }
    .page-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1;
    }
    .page-info {
      flex: 1; min-width: 0;
    }
    .page-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .page-date {
      display: block;
      margin-top: 4px;
      font-size: 0.65rem;
      color: var(--muted);
    }
    .new-page {
      margin-top: auto;
      border: 1px dashed rgba(17,24,39,0.18);
      border-radius: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.22);
      color: var(--ink-soft);
      font-weight: 700;
    }

    .editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #dddfe7;
      padding: 10px 14px 12px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(17,24,39,0.06);
      border-radius: 12px;
      min-height: 54px;
      padding: 8px 10px;
      box-shadow: inset 0 1px rgba(255,255,255,.4);
    }

    .tool-btn,
    .toolbar select,
    .toolbar input[type="text"],
    .toolbar input[type="color"],
    .toolbar input[type="range"],
    .save-btn,
    .top-btn {
      border: 1px solid var(--toolbar-border);
      background: var(--tool-btn);
      color: var(--ink);
      border-radius: 8px;
      min-height: 32px;
      padding: 0 12px;
    }
    .tool-btn.active {
      background: var(--tool-btn-active);
      border-color: rgba(44,126,245,.2);
      color: var(--blue);
      font-weight: 700;
    }
    .toolbar select { padding-right: 10px; }
    .toolbar input[type="color"] { width: 48px; padding: 2px; }
    .toolbar input[type="range"] { width: 90px; padding: 0; }
    .toolbar input[type="text"] { min-width: 230px; }
    .save-btn {
      margin-left: auto;
      background: linear-gradient(180deg, #2c7ef5, #1a67d9);
      color: white;
      border-color: rgba(18,72,170,0.3);
      font-weight: 700;
    }

    .blank-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0 4px;
    }

    .paper-shell {
      position: relative;
      width: min(100%, 760px);
      height: min(80vh, 920px);
      min-height: 480px;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 10px 20px var(--shadow);
      padding: 12px;
    }

    .paper {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--paper);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(17,24,39,0.1);
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 28px,
        rgba(17,24,39,.08) 29px,
        transparent 30px
      );
      pointer-events: none;
    }

    .paper::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 0;
      bottom: 0;
      background: linear-gradient(
        to right,
        transparent 0,
        transparent 12px,
        rgba(17,24,39,0.04) 13px,
        transparent 14px,
        transparent 100%
      );
      pointer-events: none;
    }

    canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      touch-action: none;
      cursor: crosshair;
    }

    .note-titlebar {
      position: absolute;
      inset: 12px 24px auto 24px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .title-box {
      width: min(70%, 500px);
      text-align: center;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 0.04em;
      color: rgba(17,24,39,0.8);
      background: rgba(255,255,255, 0.5);
      border-radius: 999px;
      padding: 6px 10px;
      border: 1px solid rgba(17,24,39,0.06);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bottom-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(17,24,39,0.06);
      border-radius: 12px;
      min-height: 54px;
      padding: 8px 12px;
      margin-top: 12px;
      overflow: auto;
    }

    .swatch {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(17,24,39,0.2); display: inline-block;
    }
    .swatch.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(44,126,245,.35); }

    .status {
      min-height: 22px;
      margin-top: 12px;
      padding: 0 4px;
      color: var(--ink-soft);
      font-size: 0.85rem;
    }
    .status.error { color: var(--danger); }

    .login-box {
      width: min(100%, 520px);
      margin: 42px auto 0;
      padding: 28px 20px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(17,24,39,0.06);
      border-radius: 14px;
      text-align: center;
    }
    .login-box strong { font-size: 1.3rem; display: block; margin-bottom: 8px; }
    .login-box a { color: var(--blue); font-weight: 700; }

    @media (max-width: 900px) {
      .sidebar { width: 200px; }
      .toolbar { flex-wrap: wrap; }
      .toolbar input[type="text"] { min-width: 0; flex: 1 1 160px; }
      .paper-shell { height: 70vh; }
    }

    @media (max-width: 680px) {
      .workspace { flex-direction: column; }
      .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid #dfe3ed; }
      .page-list { flex-direction: row; overflow: auto; }
      .page-item { min-width: 180px; }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="book-name">漢字専用アルファ</div>
        <span class="book-count" id="pageCount">0 件</span>
      </div>
      <div id="pageList" class="page-list" aria-label="ノート一覧"></div>
      <button class="new-page" id="newPageSidebar" type="button">＋ ページを追加</button>
    </aside>

    <main class="editor">
      <div class="toolbar">
        <button id="penTool" class="tool-btn active" type="button">ボールペン</button>
        <button id="pencilTool" class="tool-btn" type="button">鉛筆</button>
        <button id="markerTool" class="tool-btn" type="button">マーカー</button>
        <button id="highlighterTool" class="tool-btn" type="button">蛍光</button>
        <button id="eraserTool" class="tool-btn" type="button">消しゴム</button>
        <label for="colorPicker" style="font-weight:700;">色</label>
        <input id="colorPicker" type="color" value="#20283d" aria-label="ペンの色" />
        <label for="sizeRange" style="font-weight:700;">太さ</label>
        <input id="sizeRange" type="range" min="2" max="28" value="5" aria-label="ペンの太さ" />
        <button id="undoBtn" class="tool-btn" type="button">戻す</button>
        <button id="clearBtn" class="tool-btn" type="button">全消去</button>
        <input id="noteTitle" type="text" maxlength="80" placeholder="ノートのタイトル" aria-label="ノートのタイトル" />
        <button id="saveBtn" class="save-btn" type="button">保存</button>
      </div>

      <div class="blank-area">
        <div class="paper-shell">
          <div class="paper">
            <div class="note-titlebar"><div id="titleBadge" class="title-box">漢字コンクール対策</div></div>
            <canvas id="sheet" width="900" height="1200" aria-label="手書きノートのキャンバス"></canvas>
          </div>
        </div>
      </div>

      <div class="bottom-tools">
        <button type="button" class="tool-btn active" data-color="#20283d" data-tool="ballpoint" style="padding:0 10px;">ボールペン</button>
        <button type="button" class="tool-btn" data-tool="pencil" style="padding:0 10px;">鉛筆</button>
        <button type="button" class="tool-btn" data-tool="marker" style="padding:0 10px;">マーカー</button>
        <button type="button" class="tool-btn" data-tool="highlighter" style="padding:0 10px;">蛍光</button>
        <button type="button" class="tool-btn" data-tool="eraser" style="padding:0 10px;">消しゴム</button>
        <span style="display:inline-flex; align-items:center; gap:8px; margin-left: 10px;">
          <span class="swatch active" data-color="#20283d" style="background:#20283d;"></span>
          <span class="swatch" data-color="#ef4444" style="background:#ef4444;"></span>
          <span class="swatch" data-color="#3b82f6" style="background:#3b82f6;"></span>
          <span class="swatch" data-color="#22c55e" style="background:#22c55e;"></span>
          <span class="swatch" data-color="#f59e0b" style="background:#f59e0b;"></span>
        </span>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">ノートを開いています…</div>
    </main>
  </div>

  <section id="loginPrompt" class="login-box hidden">
    <strong>ログインが必要です</strong>
    <p>手書きノートを使うには、My Hubにロ��インしてください。</p>
    <a href="./">My Hubに戻る</a>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20261115-notebook"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const canvas = $('sheet');
      const ctx = canvas.getContext('2d');
      const state = {
        client: null,
        user: null,
        notebooks: [],
        strokes: [],
        currentId: null,
        activeStroke: null,
        mode: 'ballpoint',
        color: '#20283d',
        width: 5,
        saving: false,
        baseImage: null
      };

      function status(text, error = false) {
        const el = $('status');
        el.textContent = text;
        el.classList.toggle('error', error);
      }

      function point(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * canvas.width / rect.width,
          y: (event.clientY - rect.top) * canvas.height / rect.height
        };
      }

      function drawPaperGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const lineGap = 30;
        const left = 48;
        const right = canvas.width - 24;
        ctx.strokeStyle = 'rgba(17,24,39,0.08)';
        ctx.lineWidth = 1;
        for (let y = 48; y < canvas.height; y += lineGap) {
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(20, 0);
        ctx.lineTo(20, canvas.height);
        ctx.strokeStyle = 'rgba(17,24,39,0.05)';
        ctx.stroke();
      }

      function drawStrokes() {
        if (state.baseImage) {
          ctx.drawImage(state.baseImage, 0, 0, canvas.width, canvas.height);
        }
        for (const stroke of state.strokes) {
          if (!stroke.points || !stroke.points.length) continue;
          const style = strokeStyle(stroke);
          ctx.save();
          ctx.globalAlpha = style.alpha;
          ctx.globalCompositeOperation = style.composite;
          ctx.strokeStyle = stroke.color;
          ctx.fillStyle = stroke.color;
          ctx.lineWidth = style.width;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (stroke.points.length === 1) {
            const p = stroke.points[0];
            ctx.beginPath();
            ctx.arc(p.x, p.y, style.width / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
            for (let i = 1; i < stroke.points.length; i++) {
              ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
            }
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawCanvas() {
        drawPaperGrid();
        drawStrokes();
      }

      function strokeStyle(stroke) {
        let width = Number(stroke.width) || 5;
        let alpha = 1;
        let composite = 'source-over';
        if (stroke.type === 'pencil') { width *= 0.72; alpha = 0.58; }
        if (stroke.type === 'marker') { width *= 2.4; alpha = 0.72; }
        if (stroke.type === 'highlighter') { width *= 3.8; alpha = 0.24; }
        if (stroke.erase) { width *= 2.8; alpha = 1; composite = 'destination-out'; }
        return { width, alpha, composite };
      }

      function setTool(tool) {
        state.mode = tool;
        document.querySelectorAll('.tool-btn[data-tool], .tool-btn').forEach((btn) => {
          if (btn.id === 'penTool' || btn.id === 'pencilTool' || btn.id === 'markerTool' || btn.id === 'highlighterTool' || btn.id === 'eraserTool') {
            btn.classList.toggle('active', (btn.id === 'penTool' && tool === 'ballpoint') || (btn.id === 'pencilTool' && tool === 'pencil') || (btn.id === 'markerTool' && tool === 'marker') || (btn.id === 'highlighterTool' && tool === 'highlighter') || (btn.id === 'eraserTool' && tool === 'eraser');
          }
          if (btn.dataset.tool) {
            btn.classList.toggle('active', btn.dataset.tool === tool);
          }
        });
      }

      function setColor(color) {
        state.color = color;
        $('colorPicker').value = color;
        document.querySelectorAll('.swatch').forEach((s) => s.classList.toggle('active', s.dataset.color === color));
      }

      function blankPage() {
        state.currentId = null;
        state.strokes = [];
        state.baseImage = null;
        $('noteTitle').value = '';
        $('titleBadge').textContent = '新しいページ';
        drawCanvas();
      }

      function imageOf(note) {
        return note?.imageDataUrl || note?.drawing || '';
      }

      function renderSidebar() {
        const list = $('pageList');
        list.replaceChildren();
        const notes = state.notebooks.length ? state.notebooks : [];
        $('pageCount').textContent = `${notes.length} 件`;

        notes.forEach((note, index) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'page-item' + (state.currentId === note.id ? ' active' : '');
          item.addEventListener('click', () => openNotebook(note));
          const thumb = document.createElement('div');
          thumb.className = 'page-thumb';
          const img = document.createElement('img');
          img.alt = note.title || 'ノート';
          img.src = imageOf(note) || '';
          if (img.src) thumb.appendChild(img);
          const info = document.createElement('div');
          info.className = 'page-info';
          const title = document.createElement('div');
          title.className = 'page-title';
          title.textContent = note.title || `ページ ${index + 1}`;
          const date = document.createElement('span');
          date.className = 'page-date';
          date.textContent = note.updatedAt ? new Date(note.updatedAt).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }) : '今日';
          info.append(title, date);
          item.append(thumb, info);
          list.append(item);
        });
      }

      function openNotebook(note) {
        state.currentId = note.id;
        state.strokes = [];
        $('noteTitle').value = note.title || '';
        $('titleBadge').textContent = note.title || '新しいページ';

        const src = imageOf(note);
        if (src) {
          const img = new Image();
          img.onload = () => {
            state.baseImage = img;
            drawCanvas();
          };
          img.onerror = () => {
            state.baseImage = null;
            drawCanvas();
          };
          img.src = src;
        } else {
          state.baseImage = null;
          drawCanvas();
        }

        renderSidebar();
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (!state.user) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        const erase = state.mode === 'eraser';
        state.activeStroke = {
          type: erase ? 'eraser' : state.mode,
          erase,
          color: erase ? '#fff' : state.color,
          width: Number($('sizeRange').value),
          points: [point(event)]
        };
        state.strokes.push(state.activeStroke);
        drawCanvas();
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!state.activeStroke) return;
        event.preventDefault();
        state.activeStroke.points.push(point(event));
        drawCanvas();
      });

      function finishStroke() {
        state.activeStroke = null;
      }
      canvas.addEventListener('pointerup', finishStroke);
      canvas.addEventListener('pointercancel', finishStroke);
      canvas.addEventListener('lostpointercapture', finishStroke);

      $('undoBtn').addEventListener('click', () => {
        state.strokes.pop();
        drawCanvas();
      });

      $('clearBtn').addEventListener('click', () => {
        if (confirm('このページの書き込みをすべて消しますか？')) {
          state.strokes = [];
          drawCanvas();
        }
      });

      $('newPageSidebar').addEventListener('click', () => {
        blankPage();
      });

      document.querySelectorAll('.tool-btn[data-tool]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const tool = btn.dataset.tool;
          setTool(tool);
        });
      });
      $('penTool').addEventListener('click', () => setTool('ballpoint'));
      $('pencilTool').addEventListener('click', () => setTool('pencil'));
      $('markerTool').addEventListener('click', () => setTool('marker'));
      $('highlighterTool').addEventListener('click', () => setTool('highlighter'));
      $('eraserTool').addEventListener('click', () => setTool('eraser'));

      $('colorPicker').addEventListener('input', (event) => setColor(event.target.value));
      document.querySelectorAll('.swatch').forEach((swatch) => {
        swatch.addEventListener('click', () => setColor(swatch.dataset.color));
      });
      $('sizeRange').addEventListener('input', (event) => {
        state.width = Number(event.target.value);
      });

      async function loadNotebooks() {
        const { data, error } = await state.client.from('study_profiles').select('workspace').eq('user_id', state.user.id).maybeSingle();
        if (error) throw error;
        const workspace = data && typeof data.workspace === 'object' ? data.workspace : {};
        state.notebooks = Array.isArray(workspace.notebooks) ? workspace.notebooks : [];
        renderSidebar();
        if (state.notebooks.length) openNotebook(state.notebooks[0]);
        else blankPage();
      }

      async function savePage() {
        if (state.saving) return;
        state.saving = true;
        status('保存しています…');
        try {
          const title = $('noteTitle').value.trim() || '新しいページ';
          $('titleBadge').textContent = title;
          const now = new Date().toISOString();
          const imageDataUrl = canvas.toDataURL('image/jpeg', 0.72);
          const page = {
            id: state.currentId || globalThis.crypto?.randomUUID?.() || String(Date.now()),
            title,
            createdAt: state.notebooks.find((n) => n.id === state.currentId)?.createdAt || now,
            updatedAt: now,
            imageDataUrl,
            note: '授業ノート'
          };

          const { data, error } = await state.client.from('study_profiles').select('workspace').eq('user_id', state.user.id).maybeSingle();
          if (error) throw error;
          const workspace = data && typeof data.workspace === 'object' ? data.workspace : {};
          const notebooks = Array.isArray(workspace.notebooks) ? [...workspace.notebooks] : [];
          const idx = notebooks.findIndex((n) => n.id === page.id);
          if (idx >= 0) notebooks[idx] = page; else notebooks.push(page);

          const { error: updateError } = await state.client.from('study_profiles').update({
            workspace: { ...workspace, notebooks },
            updated_at: now
          }).eq('user_id', state.user.id);
          if (updateError) throw updateError;

          state.notebooks = notebooks;
          state.currentId = page.id;
          renderSidebar();
          status('保存しました。');
        } catch (error) {
          console.error(error);
          status(error.message || '保存できませんでした。', true);
        } finally {
          state.saving = false;
        }
      }

      $('saveBtn').addEventListener('click', savePage);

      async function init() {
        try {
          if (!window.supabase || !window.STUDYFLOW_SUPABASE_URL || !window.STUDYFLOW_SUPABASE_ANON_KEY) {
            throw new Error('Supabaseの設定を確認してください。');
          }
          state.client = window.supabase.createClient(window.STUDYFLOW_SUPABASE_URL, window.STUDYFLOW_SUPABASE_ANON_KEY);
          const { data, error } = await state.client.auth.getSession();
          if (error) throw error;
          if (!data.session?.user) {
            $('loginPrompt').classList.remove('hidden');
            status('ログインが必要です。');
            return;
          }
          state.user = data.session.user;
          await loadNotebooks();
          setTool('ballpoint');
          setColor('#20283d');
        } catch (error) {
          console.error(error);
          status(error.message || 'ノートを読み込めませんでした。', true);
        }
      }

      drawCanvas();
      init();
    })();
  </script>
</body>
</html>
